# Spike for shahparshva72/not-quite-my-tempo#33: a Fletcher review run on the
# repository owner's Claude subscription inside this repo's own Actions.
# Throwaway. Don't merge.
#
# The "Build the review bundle" step stands in for Fletcher's future
# POST /runner/v1/claim. It runs Fletcher's spike script, which builds the
# production prompt and checks out the pull request under review. Nothing
# is posted to the pull request; the review lands in the job summary.
# Claude Code runs as the unmodified CLI (see the review step for why).
name: Fletcher Claude runner spike

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: fletcher-claude-spike-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    env:
      # The pull request to review. Empty reviews this one instead.
      TARGET_PR: "62"
      FLETCHER_REF: claude-subscription-runner-spike
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Get Fletcher
        run: |
          git clone --quiet --depth 1 --branch "$FLETCHER_REF" \
            https://github.com/shahparshva72/not-quite-my-tempo.git "$RUNNER_TEMP/fletcher"
          npm install --global --silent pnpm@12.10.1
          cd "$RUNNER_TEMP/fletcher" && pnpm install --frozen-lockfile --silent

      - name: Build the review bundle (stands in for the claim endpoint)
        id: bundle
        working-directory: ${{ runner.temp }}/fletcher
        run: |
          pr="${TARGET_PR:-${{ github.event.pull_request.number }}}"
          cat > "$RUNNER_TEMP/fletcher.json" <<'JSON'
          {
            "intensity": "carnegie",
            "tone": "ruthless",
            "severityThreshold": "warning",
            "ignore": ["**/*.lock", "pnpm-lock.yaml", "package-lock.json"]
          }
          JSON
          pnpm --filter @not-quite-my-tempo/api spike:claude-review \
            --pr "$GITHUB_REPOSITORY#$pr" \
            --config "$RUNNER_TEMP/fletcher.json" \
            --workdir "$GITHUB_WORKSPACE" \
            --bundle-only
          bundle="$GITHUB_WORKSPACE.fletcher"
          {
            echo "pr=$pr"
            echo "bundle=$bundle"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Bundle for #$pr"
            echo "- prompt.md: $(wc -c < "$bundle/prompt.md") bytes"
            echo "- system.md: $(wc -c < "$bundle/system.md") bytes"
            echo "- checkout: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The unmodified Claude Code CLI, not claude-code-action: the action
      # passes its prompt input through the environment, and a 290 KB prompt
      # fails with "Argument list too long" (Linux caps one variable at
      # 128 KiB). The CLI reads the prompt on stdin instead. The token is in
      # this step's environment only.
      - name: Review with Claude Code on the subscription
        id: claude
        working-directory: ${{ github.workspace }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
        run: |
          npm install --global --silent @anthropic-ai/claude-code@2.1.318
          claude -p \
            --append-system-prompt-file "$BUNDLE/system.md" \
            --output-format json \
            --json-schema "$(jq -c . "$BUNDLE/schema.json")" \
            --tools "Read,Grep,Glob" \
            --allowedTools "Read,Grep,Glob" \
            --permission-mode dontAsk \
            --max-turns 20 \
            --model claude-sonnet-5-5 \
            --setting-sources project \
            --strict-mcp-config \
            --no-session-persistence \
            < "$BUNDLE/prompt.md" > "$BUNDLE/result.json"
          {
            echo "### Claude Code"
            jq -r '"- \(.subtype), \(.num_turns) turns, \(.duration_ms / 1000 | floor)s, $\(.total_cost_usd) API-equivalent"' "$BUNDLE/result.json"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.is_error == false and .structured_output != null' "$BUNDLE/result.json" > /dev/null
          jq -c .structured_output "$BUNDLE/result.json" > "$RUNNER_TEMP/structured_output.json"
          echo "- structured_output: $(wc -c < "$RUNNER_TEMP/structured_output.json") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Present the review as Fletcher would post it
        working-directory: ${{ runner.temp }}/fletcher
        run: |
          pnpm --filter @not-quite-my-tempo/api spike:claude-review \
            --pr "$GITHUB_REPOSITORY#${{ steps.bundle.outputs.pr }}" \
            --config "$RUNNER_TEMP/fletcher.json" \
            --workdir "$GITHUB_WORKSPACE" \
            --from-output "$RUNNER_TEMP/structured_output.json"
          cat "${{ steps.bundle.outputs.bundle }}/review.md" >> "$GITHUB_STEP_SUMMARY"
